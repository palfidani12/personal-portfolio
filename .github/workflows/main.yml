name: Build and Deploy to Production

# 1. When should this run?
on:
  push:
    branches:
      - main  # Only trigger when code is pushed to the main branch

jobs:
  # JOB 1: Build the application
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      - name: List file structure
        run: ls

  # JOB 2: Deploy to the server
  deploy:
    runs-on: ubuntu-latest
    needs: build # Wait for the build job to finish successfully
    steps:
      - name: Deploy to Server & Clean Old Files
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-avzr --delete" # 'a' is archive, 'v' is verbose, 'z' is compress, '--delete' removes old files
          SOURCE: "dist/"       # The folder created by 'npm run build'
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT }}
          TARGET: "public_html/" # The path to your web root on the server
          EXCLUDE: "/node_modules/"
