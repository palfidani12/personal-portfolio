name: Build and Deploy to Production

# 1. When should this run?
on:
  push:
    branches:
      - main  # Only trigger when code is pushed to the main branch

jobs:
  # JOB 1: Build the application
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      # Upload the 'build' folder so the next job can use it
      - name: Upload Build Folder
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: build/

  # JOB 2: Deploy to the server
  deploy:
    runs-on: ubuntu-latest
    needs: build # Wait for the build job to finish successfully
    steps:
      - name: Download Build Folder
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: ./dist

      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/danielplfi.com/html"
